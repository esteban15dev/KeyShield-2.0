<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Sin Conexión — KeyShield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #0a0a0f;
      --bg-secondary: #12121e;
      --text-primary: #f3f4f6;
      --text-secondary: #9ca3af;
      --accent-primary: #6366f1;
      --font-family: 'Outfit', sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-family);
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      background-color: var(--bg-secondary);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 40px 24px;
      border-radius: 16px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }
    i {
      font-size: 4rem;
      color: var(--accent-primary);
      margin-bottom: 20px;
      display: inline-block;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }
    p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 24px;
      background-color: var(--accent-primary);
      color: white;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      width: 100%;
      border: none;
    }
    .btn:hover {
      background-color: #4f46e5;
    }
  </style>
</head>
<body>
  <div class="container">
    <i class="ri-wifi-off-line"></i>
    <h1>Sin Conexión a Internet</h1>
    <p>KeyShield requiere una conexión activa para comunicarse de manera segura con el servidor y descifrar tus claves de acceso.</p>
    <button onclick="window.location.reload()" class="btn">
      <i class="ri-refresh-line"></i> Reintentar Conexión
    </button>
  </div>
</body>
</html>
